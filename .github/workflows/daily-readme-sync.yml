name: Daily README sync

on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Copy replit.md and commit only when it changes
        run: bash scripts/daily-readme-sync.sh
