openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Poe-only image generation
  - name: logos
    description: Exploratory logo concepts
  - name: admin
    description: Protected account oversight
paths:
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Read the account count for authorized CloudPainter administrators
      parameters:
        - in: header
          name: X-Admin-Session
          required: true
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Bounded account overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { description: Sign in required or session changed }
        "404": { description: Page not found for accounts without dashboard access }
        "503": { description: Account administration is temporarily unavailable }
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Search and page through CloudPainter accounts
      parameters:
        - in: header
          name: X-Admin-Session
          required: true
          schema: { type: string, maxLength: 256 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - in: query
          name: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Account page with limited identifying metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccountPage" }
        "400": { description: Invalid search or pagination }
        "401": { description: Sign in required or session changed }
        "404": { description: Page not found for accounts without dashboard access }
        "503": { description: Account information is temporarily unavailable }
  /admin/audit-events:
    get:
      operationId: listAdminAuditEvents
      tags: [admin]
      summary: Page through account status changes for authorized CloudPainter administrators
      parameters:
        - in: header
          name: X-Admin-Session
          required: true
          schema: { type: string, maxLength: 256 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: Bounded status-change history containing only actor, target, action, outcome, and time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditEventPage" }
        "400": { description: Invalid pagination }
        "401": { description: Sign in required or session changed }
        "404": { description: Page not found for accounts without dashboard access }
        "503": { description: Account history is temporarily unavailable }
  /admin/accounts/{userId}/status:
    put:
      operationId: setAdminAccountStatus
      tags: [admin]
      summary: Suspend or reactivate a CloudPainter account
      parameters:
        - in: header
          name: X-Admin-Session
          required: true
          schema: { type: string, maxLength: 256 }
        - in: path
          name: userId
          required: true
          schema: { type: string, pattern: "^user_[A-Za-z0-9]{5,}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccountStatus" }
      responses:
        "200":
          description: The account status was changed and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccountStatusResult" }
        "400": { description: Invalid account status request }
        "401": { description: Sign in required or session changed }
        "403": { description: Cross-site mutation denied }
        "404": { description: Page not found for accounts without dashboard access }
        "503": { description: Account status could not be changed }
  /outlines/config:
    get:
      operationId: getOutlineConfig
      tags: [images]
      summary: Hosted mask capability and account access, without inference
      responses:
        "200":
          description: Hosted outlining availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlineConfig" }
  /outlines:
    post:
      operationId: generateOutline
      tags: [images]
      summary: Consent-gated ephemeral photo mask converted into bounded contours
      parameters:
        - in: header
          name: X-Outline-Session
          required: true
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutlineInput" }
      responses:
        "200":
          description: Region-relative normalized contours, never photo pixels or remote URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlineResult" }
        "400":
          description: Invalid image, consent or request
        "401":
          description: Sign in required or session changed
        "403":
          description: Account not approved or origin denied
        "413":
          description: Image or request too large
        "429":
          description: Spending or concurrent-request limit
        "502":
          description: Invalid provider result
        "503":
          description: Provider or budget unavailable
        "504":
          description: Inference timeout
  /logo-images:
    post:
      operationId: generateLogoImage
      tags: [logos]
      summary: Generate one exploratory logo PNG from text only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoImageRequest"
      responses:
        "200":
          description: A validated 1024-square PNG, not persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoImageResult"
        "400":
          $ref: "#/components/responses/LogoImageError"
        "413":
          $ref: "#/components/responses/LogoImageError"
        "422":
          $ref: "#/components/responses/LogoImageError"
        "429":
          $ref: "#/components/responses/LogoImageError"
        "502":
          $ref: "#/components/responses/LogoImageError"
        "503":
          $ref: "#/components/responses/LogoImageError"
        "504":
          $ref: "#/components/responses/LogoImageError"
  /palette:
    parameters:
      - in: header
        name: X-Palette-Session
        required: true
        schema: { type: string }
        description: Must match the verified current session, preventing delayed requests from crossing accounts.
    get:
      operationId: getPalette
      tags: [palettes]
      responses:
        "200":
          description: Current account palette
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Palette" }
        "401":
          description: Sign in required or session changed
        "503":
          description: Palette storage temporarily unavailable
    put:
      operationId: savePalette
      tags: [palettes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Palette" }
      responses:
        "200":
          description: Saved palette with new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Palette" }
        "400":
          description: Invalid palette
        "401":
          description: Sign in required or session changed
        "403":
          description: Cross-site mutation denied
        "409":
          description: Palette changed on another device; reload before editing
        "503":
          description: Palette storage temporarily unavailable
  /settings:
    parameters:
      - in: header
        name: X-Settings-Session
        required: true
        schema: { type: string }
        description: Must match the verified current session so delayed requests cannot cross accounts.
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Current account settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudPainterSettings" }
        "401":
          description: Sign in required or session changed
        "503":
          description: Settings storage temporarily unavailable
    put:
      operationId: saveSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudPainterSettings" }
      responses:
        "200":
          description: Saved account settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudPainterSettings" }
        "400":
          description: Invalid settings
        "401":
          description: Sign in required or session changed
        "403":
          description: Cross-site mutation denied
        "503":
          description: Settings storage temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/config:
    get:
      operationId: getImageGenerationConfig
      tags: [images]
      summary: Check whether Poe image generation is configured
      responses:
        "200":
          description: Local configuration status; does not contact Poe
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  signedIn:
                    type: boolean
                  allowed:
                    type: boolean
                  dailyLimit:
                    type: integer
                  remaining:
                    type: integer
                  globalRemaining:
                    type: integer
                required: [configured, signedIn, allowed, dailyLimit, remaining, globalRemaining]
        "503":
          description: Account access database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
  /images/generate:
    post:
      operationId: generatePoeImage
      tags: [images]
      summary: Generate a reference image using an approved Poe model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeImageInput"
      responses:
        "200":
          description: Validated generated image as base64 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeImageOutput"
        "400":
          description: Invalid prompt or unapproved model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "403":
          description: Account not approved or request did not originate from CloudPainter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "429":
          description: Image generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "502":
          description: Image generation provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "503":
          description: Poe configuration or selected model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
  /images/upscale:
    post:
      operationId: upscalePoeImage
      tags: [images]
      summary: Ask Poe Assistant to upscale a merged PNG
      description: Sends the image only after an explicit user action. Poe Assistant receives exactly "Please upscale the attached image to be 4x" or "Please upscale the attached image to be 8x". Poe chooses the provider; only a PNG at the exact requested dimensions is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeUpscaleInput"
      responses:
        "200":
          description: A validated PNG at exactly 4× or 8× the input dimensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeUpscaleOutput"
        "400":
          description: Invalid scale or PNG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "403":
          description: Account not approved or request did not originate from CloudPainter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "413":
          description: Image exceeds the request-size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "429":
          description: Image request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "502":
          description: Poe returned an invalid or incorrectly sized image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "503":
          description: Poe connection unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
components:
  responses:
    LogoImageError:
      description: Safe error message; rate limits include Retry-After
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogoImageError"
  schemas:
    AdminOverview:
      type: object
      additionalProperties: false
      required: [totalAccounts]
      properties:
        totalAccounts: { type: integer, minimum: 0 }
    AdminAccount:
      type: object
      additionalProperties: false
      required: [id, name, email, createdAt, status]
      properties:
        id: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [active, suspended] }
    AdminAccountPage:
      type: object
      additionalProperties: false
      required: [accounts, totalCount, limit, offset]
      properties:
        accounts:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AdminAccount" }
        totalCount: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [actorId, targetId, action, outcome, createdAt]
      properties:
        actorId: { type: string }
        targetId: { type: string }
        action: { type: string, enum: [suspend, reactivate] }
        outcome: { type: string, enum: [pending, succeeded, failed] }
        createdAt: { type: string, format: date-time }
    AdminAuditEventPage:
      type: object
      additionalProperties: false
      required: [events, totalCount, limit, offset]
      properties:
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AdminAuditEvent" }
        totalCount: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
    AdminAccountStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }
    AdminAccountStatusResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, suspended] }
    OutlineInput:
      type: object
      additionalProperties: false
      required: [imageBase64, consent, subject, sensitivity]
      properties:
        imageBase64:
          type: string
          minLength: 16
          maxLength: 700000
          description: Bare base64 PNG or JPEG inference crop; never a remote URL
        consent: { type: boolean, enum: [true] }
        subject: { type: string, minLength: 1, maxLength: 160 }
        sensitivity: { type: number, minimum: 0.1, maximum: 0.9 }
    OutlinePoint:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    OutlineCandidate:
      type: object
      additionalProperties: false
      required: [label, points]
      properties:
        label: { type: string, maxLength: 80 }
        points:
          type: array
          minItems: 3
          maxItems: 1024
          items: { $ref: "#/components/schemas/OutlinePoint" }
    OutlineResult:
      type: object
      additionalProperties: false
      required: [candidates, model]
      properties:
        candidates:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/OutlineCandidate" }
        model: { type: string, enum: [GPT-Image-2] }
    OutlineConfig:
      type: object
      required: [configured, signedIn, allowed, model, error]
      properties:
        configured: { type: boolean }
        signedIn: { type: boolean }
        allowed: { type: boolean }
        model: { type: string, enum: [GPT-Image-2] }
        error: { type: string }
    LogoImageRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1200
        direction:
          type: string
          enum: [cloudline, viewfinder, gesture, paperfold, sunstudy]
    LogoImageResult:
      type: object
      required: [pngBase64, width, height]
      properties:
        pngBase64:
          type: string
          maxLength: 11184812
        width:
          type: integer
          enum: [1024]
        height:
          type: integer
          enum: [1024]
    LogoImageError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, BODY_TOO_LARGE, REFUSED, RATE_LIMITED, BUSY, UNAVAILABLE, PROVIDER_FAILED, INVALID_IMAGE, TIMEOUT]
        message:
          type: string
        retryable:
          type: boolean
    Palette:
      type: object
      additionalProperties: false
      required: [colors, revision]
      properties:
        revision: { type: integer, minimum: 0, maximum: 2147483646 }
        colors:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/PaletteColor" }
    PaletteColor:
      type: object
      additionalProperties: false
      required: [id, name, hex]
      properties:
        id: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
        name: { type: string, minLength: 1, maxLength: 40 }
        hex: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    CloudPainterSettings:
      type: object
      additionalProperties: false
      required: [textSize, drawingTool, brushStyle, brushSize]
      properties:
        textSize: { type: integer, minimum: 80, maximum: 140, multipleOf: 10 }
        drawingTool: { type: string, enum: [brush, pencil, pen] }
        brushStyle: { type: string, enum: [round, chisel, soft, dry] }
        brushSize: { type: integer, minimum: 1, maximum: 48 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PoeImageInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        model:
          type: string
          enum: ["Nano-Banana-Pro", "Nano-Banana-2", "GPT-Image-2.5-Sunburst", "Flux-2-Turbo"]
      required:
        - prompt
        - model
    PoeImageOutput:
      type: object
      properties:
        b64_json:
          type: string
          minLength: 1
        mime:
          type: string
          enum: ["image/png", "image/jpeg", "image/webp"]
      required:
        - b64_json
        - mime
    PoeUpscaleInput:
      type: object
      additionalProperties: false
      properties:
        pngBase64:
          type: string
          minLength: 1
          maxLength: 11184812
        scale:
          type: integer
          enum: [4, 8]
      required: [pngBase64, scale]
    PoeUpscaleOutput:
      type: object
      additionalProperties: false
      properties:
        b64_json:
          type: string
          minLength: 1
          maxLength: 16777216
        mime:
          type: string
          enum: ["image/png"]
        width:
          type: integer
          minimum: 1
          maximum: 8192
        height:
          type: integer
          minimum: 1
          maximum: 8192
      required: [b64_json, mime, width, height]
    ImageGenerationError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code
