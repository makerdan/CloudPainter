openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Poe-only image generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/config:
    get:
      operationId: getImageGenerationConfig
      tags: [images]
      summary: Check whether Poe image generation is configured
      responses:
        "200":
          description: Local configuration status; does not contact Poe
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                required: [configured]
  /images/generate:
    post:
      operationId: generatePoeImage
      tags: [images]
      summary: Generate a reference image using an approved Poe model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeImageInput"
      responses:
        "200":
          description: Validated generated image as base64 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeImageOutput"
        "400":
          description: Invalid prompt or unapproved model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "403":
          description: Requests must originate from CloudPainter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "429":
          description: Image generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "502":
          description: Image generation provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "503":
          description: Poe configuration or selected model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PoeImageInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        model:
          type: string
          enum: ["Nano-Banana-Pro", "Nano-Banana-2", "GPT-Image-2.5-Sunburst", "Flux-2-Turbo"]
      required:
        - prompt
        - model
    PoeImageOutput:
      type: object
      properties:
        b64_json:
          type: string
          minLength: 1
        mime:
          type: string
          enum: ["image/png", "image/jpeg", "image/webp"]
      required:
        - b64_json
        - mime
    ImageGenerationError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code

