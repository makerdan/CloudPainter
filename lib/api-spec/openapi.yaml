openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Poe-only image generation
  - name: logos
    description: Exploratory logo concepts
paths:
  /logo-images:
    post:
      operationId: generateLogoImage
      tags: [logos]
      summary: Generate one exploratory logo PNG from text only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoImageRequest"
      responses:
        "200":
          description: A validated 1024-square PNG, not persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoImageResult"
        "400":
          $ref: "#/components/responses/LogoImageError"
        "413":
          $ref: "#/components/responses/LogoImageError"
        "422":
          $ref: "#/components/responses/LogoImageError"
        "429":
          $ref: "#/components/responses/LogoImageError"
        "502":
          $ref: "#/components/responses/LogoImageError"
        "503":
          $ref: "#/components/responses/LogoImageError"
        "504":
          $ref: "#/components/responses/LogoImageError"
  /palette:
    parameters:
      - in: header
        name: X-Palette-Session
        required: true
        schema: { type: string }
        description: Must match the verified current session, preventing delayed requests from crossing accounts.
    get:
      operationId: getPalette
      tags: [palettes]
      responses:
        "200":
          description: Current account palette
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Palette" }
        "401":
          description: Sign in required or session changed
        "503":
          description: Palette storage temporarily unavailable
    put:
      operationId: savePalette
      tags: [palettes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Palette" }
      responses:
        "200":
          description: Saved palette with new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Palette" }
        "400":
          description: Invalid palette
        "401":
          description: Sign in required or session changed
        "403":
          description: Cross-site mutation denied
        "409":
          description: Palette changed on another device; reload before editing
        "503":
          description: Palette storage temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/config:
    get:
      operationId: getImageGenerationConfig
      tags: [images]
      summary: Check whether Poe image generation is configured
      responses:
        "200":
          description: Local configuration status; does not contact Poe
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                required: [configured]
  /images/generate:
    post:
      operationId: generatePoeImage
      tags: [images]
      summary: Generate a reference image using an approved Poe model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeImageInput"
      responses:
        "200":
          description: Validated generated image as base64 data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeImageOutput"
        "400":
          description: Invalid prompt or unapproved model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "403":
          description: Requests must originate from CloudPainter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "429":
          description: Image generation limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "502":
          description: Image generation provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
        "503":
          description: Poe configuration or selected model unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationError"
components:
  responses:
    LogoImageError:
      description: Safe error message; rate limits include Retry-After
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogoImageError"
  schemas:
    LogoImageRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1200
        direction:
          type: string
          enum: [cloudline, viewfinder, gesture, paperfold, sunstudy]
    LogoImageResult:
      type: object
      required: [pngBase64, width, height]
      properties:
        pngBase64:
          type: string
          maxLength: 11184812
        width:
          type: integer
          enum: [1024]
        height:
          type: integer
          enum: [1024]
    LogoImageError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, BODY_TOO_LARGE, REFUSED, RATE_LIMITED, BUSY, UNAVAILABLE, PROVIDER_FAILED, INVALID_IMAGE, TIMEOUT]
        message:
          type: string
        retryable:
          type: boolean
    Palette:
      type: object
      additionalProperties: false
      required: [colors, revision]
      properties:
        revision: { type: integer, minimum: 0, maximum: 2147483646 }
        colors:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/PaletteColor" }
    PaletteColor:
      type: object
      additionalProperties: false
      required: [id, name, hex]
      properties:
        id: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
        name: { type: string, minLength: 1, maxLength: 40 }
        hex: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PoeImageInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        model:
          type: string
          enum: ["Nano-Banana-Pro", "Nano-Banana-2", "GPT-Image-2.5-Sunburst", "Flux-2-Turbo"]
      required:
        - prompt
        - model
    PoeImageOutput:
      type: object
      properties:
        b64_json:
          type: string
          minLength: 1
        mime:
          type: string
          enum: ["image/png", "image/jpeg", "image/webp"]
      required:
        - b64_json
        - mime
    ImageGenerationError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
        - code
